name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  lint:
    name: Code Quality & Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run static analysis (ESLint)
        run: npx eslint . --format json --output-file eslint-report.json || true

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest & Supertest with Coverage
        run: npx vitest run --coverage --reporter=json --outputFile=test-results.json

      - name: Upload Test Results & Coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results.json
            coverage/coverage-summary.json
            coverage/

  build:
    name: Build & Package Artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build server & client
        run: npm run build

      - name: Package Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: messenger-production-build
          path: |
            server/dist
            client/dist
          retention-days: 7

  metrics:
    name: Collect & Publish Quality Metrics
    runs-on: ubuntu-latest
    needs: [lint, test, build]

    steps:
      - name: Checkout repository (full history for git metrics)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download ESLint Report
        uses: actions/download-artifact@v4
        with:
          name: eslint-report

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts

      - name: Execute Quality Metrics Collector
        run: node scripts/collect-metrics.js

  deploy:
    name: Deploy to Test Environment (GitHub Pages)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: messenger-production-build
          path: build-artifacts

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build-artifacts/client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
